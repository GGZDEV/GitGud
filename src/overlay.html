<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="ui/mascots.css">
<style>
  /* Thème « néon » : HUD esport, coins biseautés, portrait hexagonal, scanlines.
     Polices Windows (Bahnschrift, Cascadia/Consolas) : aucune ressource réseau. */
  :root {
    --bg-alpha: 0.94; --a: #4be3c1; --b: #8b5cf6; --fg: #d9fbf3; --txt: #e6fff9; --muted: #7d8b96; --dim: #3b4a52;
    --rec: #ff5d73; --scan: #facc15; --err: #ff6b6b; --cut: 14px;
    --title: "Rajdhani", "Bahnschrift SemiCondensed", "Bahnschrift", "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", "Cascadia Mono", "Consolas", monospace;
  }
  html, body { margin: 0; background: transparent; font: 500 14.5px/1.4 var(--title); color: var(--fg); overflow: hidden; user-select: none; }
  /* Ombre portée sur l'enveloppe : la découpe (clip-path) de la carte la masquerait. */
  #wrap { margin: 6px; filter: drop-shadow(0 12px 22px rgba(0,0,0,.5)); opacity: 0; transform: translateY(-8px) scale(.98); transition: opacity .25s, transform .25s; }
  #wrap.shown { opacity: 1; transform: none; }
  #card {
    position: relative; padding: 1.5px; background: linear-gradient(135deg, var(--a), var(--b));
    clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  }
  .in {
    position: relative; clip-path: inherit; padding-bottom: 12px;
    background: linear-gradient(160deg, rgba(8,14,18,var(--bg-alpha)), rgba(10,9,20,var(--bg-alpha)));
  }
  .in::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(75,227,193,.04) 0 1px, transparent 1px 3px); }

  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 14px 6px 22px; font: 600 10.5px var(--mono); letter-spacing: .12em; color: var(--a); background: rgba(75,227,193,.07); border-bottom: 1px solid rgba(75,227,193,.18); }
  .top #ver { color: #6b7c86; }
  #pin { display: none; color: var(--scan); }
  body.pinned #pin { display: inline; }

  header { display: flex; gap: 14px; align-items: center; padding: 14px 14px 0; cursor: grab; position: relative; }
  body.dragging header, body.dragging .top { cursor: grabbing; }
  .hex { width: 74px; height: 80px; flex: none; padding: 2px; background: linear-gradient(160deg, var(--a), var(--b)); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
  .hex .slot { width: 100%; height: 100%; box-sizing: border-box; clip-path: inherit; padding: 12px 8px 8px; background: radial-gradient(circle at 50% 65%, #123b37, #070b10 75%); }
  #mascot { width: 100%; height: 100%; }
  #mascot::before { display: none; } /* le portrait hexagonal fait déjà office de halo */
  .ident { min-width: 0; flex: 1; }
  #name { font: 700 30px/.9 var(--title); letter-spacing: .06em; color: #fff; text-shadow: 0 0 14px rgba(75,227,193,.5); }
  #name em { font-style: normal; color: var(--a); }
  #context { font: 400 11px var(--mono); color: var(--muted); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #chip { margin-left: auto; align-self: flex-start; text-align: right; font: 600 11px var(--mono); letter-spacing: .1em; color: var(--muted); white-space: nowrap; }
  #chip.listening { color: var(--rec); } #chip.thinking, #chip.transcribing { color: var(--scan); } #chip.speaking { color: var(--a); }
  .wave { display: inline-flex; gap: 2px; align-items: center; height: 18px; margin-top: 6px; color: var(--dim); }
  .wave i { width: 3px; height: 4px; border-radius: 2px; background: currentColor; opacity: .5; }
  #chip.listening .wave, #chip.speaking .wave { color: inherit; }
  #chip.listening .wave i, #chip.speaking .wave i { opacity: 1; animation: wv .5s ease-in-out infinite alternate; }
  .wave i:nth-child(2) { animation-delay: .1s !important; } .wave i:nth-child(3) { animation-delay: .2s !important; }
  .wave i:nth-child(4) { animation-delay: .05s !important; } .wave i:nth-child(5) { animation-delay: .15s !important; }
  @keyframes wv { from { height: 3px; } to { height: 14px; } }
  @keyframes blink { 50% { opacity: .25; } }

  /* Niveau du micro */
  #meter { display: none; align-items: flex-end; gap: 3px; height: 28px; margin: 12px 14px 0; }
  #meter.on { display: flex; }
  #meter span { flex: 1; height: 4px; background: linear-gradient(var(--a), var(--b)); box-shadow: 0 0 6px rgba(75,227,193,.4); transition: height .08s; }

  #log { max-height: 440px; overflow-y: auto; padding: 14px 14px 0; display: flex; flex-direction: column; gap: 8px; scrollbar-width: none; }
  #log:empty { display: none; }
  .msg { animation: in .25s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } }
  .msg.user { align-self: flex-end; max-width: 85%; font: 400 12px var(--mono); color: #9fb0ba; padding: 4px 10px; border-right: 2px solid var(--b); background: rgba(139,92,246,.08); }
  .msg.assistant, .msg.pending { padding: 10px 12px; border-left: 2px solid var(--a); background: rgba(75,227,193,.06); color: var(--txt); font: 500 15px/1.4 var(--title); white-space: pre-wrap; }
  .msg.assistant::before, .msg.pending::before { content: "> "; color: var(--a); font: 12px var(--mono); }
  .msg.assistant.typing::after { content: "▍"; color: var(--a); animation: blink .8s infinite; }
  .msg.pending { color: var(--scan); font: 600 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
  .msg.pending i { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: currentColor; margin-left: 3px; animation: dt 1s infinite; }
  .msg.pending i:nth-child(2) { animation-delay: .15s; } .msg.pending i:nth-child(3) { animation-delay: .3s; }
  @keyframes dt { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  .msg.error { color: var(--err); font: 600 12px var(--mono); padding: 8px 12px; border-left: 2px solid var(--err); background: rgba(255,107,107,.08); }
  .msg.error::before { content: "! "; }
  .msg.notice { color: var(--muted); font: italic 400 12px var(--mono); }
  .msg.old { opacity: .45; }

  /* Diablo IV : fiche d'objet survolé (verdict local, sans IA) */
  #d4card { display: none; margin: 14px 14px 0; padding: 10px 12px; background: rgba(255,255,255,.035); border: 1px solid rgba(75,227,193,.18); clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
  #d4card.on { display: block; animation: in .2s ease-out; }
  .d4-head { display: flex; align-items: baseline; gap: 8px; }
  .d4-name { font-weight: 700; font-size: 16px; letter-spacing: .03em; color: #fff; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .d4-slot { font: 11px var(--mono); color: var(--muted); }
  .d4-verdict { margin: 6px 0 8px; padding: 3px 9px; font: 600 11.5px var(--mono); letter-spacing: .05em; display: inline-block; }
  .v-top { background: rgba(34,197,94,.18); color: #4ade80; } .v-good { background: rgba(163,230,53,.15); color: #bef264; }
  .v-meh { background: rgba(245,158,11,.15); color: #fbbf24; } .v-bad { background: rgba(239,68,68,.15); color: #f87171; } .v-neutral { background: rgba(148,163,184,.12); color: var(--muted); }
  .d4-row { display: grid; grid-template-columns: 16px 1fr 46px; gap: 6px; align-items: center; font-size: 13.5px; padding: 2px 0; color: var(--txt); }
  .d4-row.no { color: var(--muted); }
  .d4-ok { color: #4ade80; font-weight: 700; } .d4-ko { color: #f87171; }
  .d4-bar { height: 5px; background: rgba(255,255,255,.08); overflow: hidden; }
  .d4-bar i { display: block; height: 100%; background: linear-gradient(90deg, #f59e0b, #4ade80); }
  .d4-star { color: #fbbf24; }
  .d4-foot { margin-top: 6px; font: 11px var(--mono); color: var(--muted); }
  .d4-sync { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; font-size: 13px; margin-top: 6px; }
  .d4-sync .done { color: #4ade80; }

  /* Sources citées dans la réponse : pastilles cliquables */
  .sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: -2px; }
  .sources a { font: 600 10.5px var(--mono); letter-spacing: .04em; color: var(--a); border: 1px solid rgba(75,227,193,.22); padding: 3px 9px; text-decoration: none; cursor: pointer; clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px); }
  .sources a:hover { border-color: var(--a); background: rgba(75,227,193,.08); }

  #ask { display: none; padding: 14px 14px 0; }
  #ask input { width: 100%; box-sizing: border-box; background: rgba(75,227,193,.05); border: 1px solid rgba(75,227,193,.25); border-left: 2px solid var(--a); color: var(--txt); padding: 9px 12px; font: 500 14.5px var(--title); outline: none; }
  #ask input::placeholder { color: var(--muted); }
  #ask input:focus { border-color: var(--a); box-shadow: 0 0 0 3px rgba(75,227,193,.15); }

  footer { display: flex; gap: 6px; padding: 14px 14px 0; flex-wrap: wrap; }
  footer .k { font: 600 11px var(--mono); letter-spacing: .06em; color: #9fb0ba; border: 1px solid rgba(75,227,193,.22); padding: 5px 9px; clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); }
  footer .k b { color: var(--a); text-transform: uppercase; }

  /* Mode compact : portrait + statut + dernière ligne de réponse */
  body.compact { --cut: 10px; }
  body.compact .top, body.compact #context, body.compact footer, body.compact #chip .lbl, body.compact .msg.user, body.compact .msg.old, body.compact .sources,
  body.compact .d4-row.no, body.compact .d4-foot { display: none; }
  body.compact header { padding: 10px 10px 0; gap: 10px; }
  body.compact .hex { width: 50px; height: 54px; }
  body.compact .hex .slot { padding: 7px 5px 5px; }
  body.compact #name { font-size: 22px; }
  body.compact .wave { margin-top: 0; }
  body.compact .in { padding-bottom: 10px; }
  body.compact #log { padding: 10px 10px 0; max-height: none; }
  body.compact .msg.assistant { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; }
  body.compact #meter { margin: 8px 10px 0; height: 18px; }
  body.compact #d4card { margin: 10px 10px 0; padding: 8px 10px; }
  body.compact #ask { padding: 10px 10px 0; }
</style>
</head>
<body>
  <div id="wrap"><div id="card"><div class="in">
    <div class="top"><span>GAMEHELPER // ASSIST <span id="pin">· ÉPINGLÉ</span></span><span id="ver">ONLINE</span></div>
    <header id="handle" title="Glisser pour déplacer">
      <div class="hex"><div class="slot"><div id="mascot"></div></div></div>
      <div class="ident">
        <div id="name">KIN<em>.</em></div>
        <div id="context"></div>
      </div>
      <div id="chip"><div class="lbl" id="status">[ PRÊT ]</div><span class="wave"><i></i><i></i><i></i><i></i><i></i></span></div>
    </header>
    <div id="meter"></div>
    <div id="d4card"></div>
    <div id="log"></div>
    <form id="ask"><input id="askInput" placeholder="Ta question… (Entrée pour envoyer, Échap pour annuler)" autocomplete="off"></form>
    <footer>
      <span class="k"><b id="hkPtt">Alt + V</b> PARLER</span><span class="k"><b id="hkText">Alt + T</b> ÉCRIRE</span><span class="k"><b id="hkHide">Alt + X</b> FERMER</span>
    </footer>
  </div></div></div>
  <script src="ui/mascots.js"></script>
  <script src="overlay.js"></script>
  <script src="overlay-d4.js"></script>
</body>
</html>
